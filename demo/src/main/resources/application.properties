spring.application.name=demo

# 密碼放在 demo/secrets.properties（不會上傳 GitHub），或用環境變數 DB_PASSWORD
spring.config.import=optional:file:./secrets.properties

# Render 會用環境變數 PORT 指定 port，本機沒設定時用 8080
server.port=${PORT:8080}

# Supabase 連線資訊
spring.datasource.url=jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:6543/postgres?sslmode=require
spring.datasource.username=postgres.bwumuyiczuevwknjikdq
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA 設定
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect