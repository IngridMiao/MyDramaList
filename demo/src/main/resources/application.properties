spring.application.name=demo

# 密碼放在 demo/secrets.properties（不會上傳 GitHub），或用環境變數 DB_PASSWORD
spring.config.import=optional:file:./secrets.properties

# Render 會用環境變數 PORT 指定 port，本機沒設定時用 8080
server.port=${PORT:8080}

# Supabase 連線資訊
spring.datasource.url=jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
spring.datasource.username=postgres.bwumuyiczuevwknjikdq
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# 6543 是 Supabase 的 Transaction pooler，不支援 server-side prepared statement，
# 所以上面加了 prepareThreshold=0；否則會隨機出現 "prepared statement S_x already exists" 錯誤。
# Render 免費方案記憶體小，連線池不用開太大；連不到資料庫時 20 秒就放棄，不要卡住請求
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

# JPA 設定
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 給 App 喚醒與 keep-alive 用的健康檢查端點：GET /actuator/health
management.endpoints.web.exposure.include=health
