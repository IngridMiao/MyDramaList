name: Keep Render backend awake

# Render 免費方案閒置 15 分鐘就會休眠，下次請求要冷啟動 30～90 秒。
# 這個排程每 10 分鐘戳一次健康檢查端點，讓後端保持清醒。
# 注意：GitHub 排程可能延遲幾分鐘；repo 60 天沒有任何 commit 時，GitHub 會自動停用排程。
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          url="${BACKEND_URL%/}/actuator/health"
          echo "Pinging $url"
          curl -sS --max-time 120 --retry 3 --retry-delay 10 -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" "$url" || true
